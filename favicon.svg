<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Mates Playing Golf">
  <!-- A pin, pennant and ball, in the society badge's colours: the badge's dark
       green ground, its red course flag, its light green, and white.

       Deliberately NOT the badge itself. The badge is four figures and three
       lines of type inside a ring - at 16px, which is the size a browser tab
       actually draws a favicon, all of that collapses into a green smudge. This
       carries the same colours so the two read as one identity, with a shape
       that survives being 16 pixels across. -->
  <rect width="32" height="32" rx="7" fill="#14532B"/>
  <path d="M4.5 25.5 H27.5" stroke="#A3DC5B" stroke-width="1.6" stroke-linecap="round" opacity=".85"/>
  <path d="M11.6 6.4 V24.4" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M13.2 7.0 L24.4 11.3 L13.2 15.6 Z" fill="#E1332B"/>
  <circle cx="20.4" cy="21.6" r="3" fill="#FFFFFF"/>
</svg>
