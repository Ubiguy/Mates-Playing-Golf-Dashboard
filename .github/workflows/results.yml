# Publish team match results submitted by the captains.
#
# The captains fill in a Google Form from their phones. Its responses sheet is
# published as CSV, this reads it, regenerates the MATCHES block in data.js and
# commits. No PC is involved, which is the whole point: results used to need
# one person at one machine with the Excel tracker open.
#
# Nothing here touches the tracker. Handicaps, rounds and WHS records stay on
# that PC and out of this repo - the site's data.js already carries everything
# this job needs.
#
# RESULTS_CSV_URL is a repository secret rather than a literal so the sheet's
# address is not published alongside the site. It holds match results only, the
# same data the site shows, but there is no reason to hand out the URL.
name: Publish match results

on:
  schedule:
    # Four times an hour, deliberately off the hour: GitHub's scheduler is
    # busiest at :00 and a job queued then waits longer. Best effort either
    # way - a scheduled run can lag by several minutes under load, so this
    # buys a typical 15 minutes rather than a guaranteed one. Run workflow
    # is still there when somebody wants a result up immediately.
    - cron: '5,20,35,50 * * * *'
  workflow_dispatch:            # and a "Run workflow" button, for right now

permissions:
  contents: write

concurrency:
  group: publish-results        # never two commits racing each other
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          # no pip install: with the form as the source this is pure stdlib

      # The cron runs twice an hour from the moment this lands on main, which is
      # before the form exists. Skipping cleanly rather than failing keeps that
      # from mailing a failure notice every thirty minutes.
      - name: Is the form configured yet?
        id: cfg
        env:
          RESULTS_CSV_URL: ${{ secrets.RESULTS_CSV_URL }}
        run: |
          if [ -z "$RESULTS_CSV_URL" ]; then
            echo "RESULTS_CSV_URL is not set - skipping until the form is live"
            echo "ready=no" >> "$GITHUB_OUTPUT"
          else
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Read the form and regenerate data.js
        if: steps.cfg.outputs.ready == 'yes'
        env:
          RESULTS_CSV_URL: ${{ secrets.RESULTS_CSV_URL }}
          DATA_JS: data.js
        run: |
          set -o pipefail
          python tools/results_import.py 2>&1 | tee /tmp/results-run.txt
          python tools/matches_write.py

      # The score record, BEFORE the restamp: it writes changes.js, and an
      # asset stamped before it is written carries the wrong hash.
      # data.js is regenerated every run, so it only ever
      # holds today's answer - this is the dated, append-only trail beside it,
      # and it is where a wrong score gets retraced from. Runs before the
      # commit so its own row is part of the same commit.
      - name: Record the score
        id: log
        if: steps.cfg.outputs.ready == 'yes'
        env:
          RESULTS_CSV_URL: ${{ secrets.RESULTS_CSV_URL }}
        run: |
          set -o pipefail
          python tools/score_log.py . | tee score-run.txt
          {
            echo "headline<<EOF"
            sed -n 's/^headline: //p' score-run.txt
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          rm -f score-run.txt

      - name: Restamp the pages
        if: steps.cfg.outputs.ready == 'yes'
        run: python stamp.py .

      - name: Commit if anything changed
        if: steps.cfg.outputs.ready == 'yes'
        env:
          # Through the environment rather than inlined: a commit subject built
          # from data should never be pasted into a shell command.
          MSG: ${{ steps.log.outputs.headline }}
        run: |
          if git diff --quiet; then
            echo "no change - no result has been submitted since the last run"
            exit 0
          fi
          git config user.name  "mpgolf results bot"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "${MSG:-Results from the captains form}"
          git push

      # LAST, and deliberately after the publish. A row the importer could not
      # make sense of is skipped: the rest of the season still publishes, which
      # is right, but until now the only trace was a line in the log of a green
      # run - and nobody reads the log of a green run. Failing here turns that
      # into the mail GitHub sends when a job goes red, which is the only
      # channel anybody actually watches.
      - name: Say so if any row was refused
        if: steps.cfg.outputs.ready == 'yes'
        run: |
          if grep -q '^   PROBLEM' /tmp/results-run.txt; then
            echo "The site published, but these rows were left out:"
            echo
            grep '^   PROBLEM' /tmp/results-run.txt
            echo
            echo "Nothing is lost - the responses sheet keeps every submission,"
            echo "and a corrected one supersedes. Fix the row and the next run"
            echo "picks it up."
            exit 1
          fi
          echo "every row was understood"
